<!doctype html>
<html lang="en" dir="ltr" data-alliance="DGF">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DGF Alliance HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Golos+Text:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="board.css?v=d49ab1b950">
<link rel="stylesheet" href="home.css?v=422d3bbd2b">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div id="shell-top"></div>

<main id="main">
  <section class="season wrap" aria-labelledby="season-title">
    <div class="season-head">
      <h2 class="season-name" id="season-title">Dinosaur Era</h2>
      <p class="season-sub">Season 8</p>
      <p class="season-cell"><span>State</span> <strong id="state"></strong></p>
      <p class="season-cell"><span>Server time</span> <strong id="server-time"></strong></p>
    </div>
    <p class="season-step" id="season-step"></p>
    <ol class="ruler" id="ruler"></ol>
  </section>

  <section class="board" aria-labelledby="board-title">
    <div class="wrap">
      <h2 class="group" id="board-title">Coming up</h2>
      <ul class="rows" id="coming"></ul>
    </div>
  </section>
  <p class="wrap footnote" id="footnote"></p>

  <section class="prep wrap" aria-labelledby="prep-title">
    <h2 class="h2" id="prep-title">Prep</h2>
    <ul class="rows rows--paper" id="prep-rows"></ul>
  </section>

  <section class="board roster-board" aria-labelledby="roster-title">
    <div class="wrap">
      <h2 class="visually-hidden" id="roster-title">Roster board</h2>
      <h3 class="group">Diplomacy</h3>
      <ul class="rows" id="diplomacy"></ul>
      <h3 class="group">Leadership</h3>
      <ul class="rows" id="leaders"></ul>
    </div>
  </section>
</main>

<div id="shell-foot"></div>
<script src="../shared/hq.js?v=2b56ef5875"></script>
<script src="glyphs.js?v=8b179a9125"></script>

</body>
</html>

<body>
<a class="skip" href="#main">Skip to content</a>
<div class="ground" aria-hidden="true"><img id="groundArt" alt=""></div>

<header class="strip">
  <a class="brand" href="home.html">
    <span class="insignia" id="brandInsignia" aria-hidden="true"></span>
    <span class="brand-name" id="brandName">The Dragonfly</span>
  </a>
  <label class="lang">
    <span class="sr">Language</span>
    <svg class="lang-glyph" viewBox="0 0 24 24" aria-hidden="true"><polygon class="hexbg" points="12,1.5 21.5,7 21.5,17 12,22.5 2.5,17 2.5,7"/><text x="12" y="15.5" text-anchor="middle">Aa</text></svg>
    <select id="lang"></select>
    <svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5.5l5 5 5-5z"/></svg>
  </label>
</header>

<main id="main">
  <section class="frame frame-main" aria-labelledby="allianceName">
    <span class="corners" aria-hidden="true"></span>
    <div class="plate-title"><div>
      <span class="insignia big" id="titleInsignia" aria-hidden="true"></span>
      <h1 id="allianceName">The Dragonfly</h1>
      <p class="motto" id="motto"></p>
    </div></div>
    <nav class="tabs" aria-label="Site"></nav>
    <div class="frame-body">
      <div class="frame-head">
        <h2 id="seasonName">Season 8: Dinosaur Era</h2>
        <p class="week" id="weekLine">Week 4 of 10</p>
      </div>
      <div class="season-grid">
        <div class="tree" id="tree"></div>
        <div class="detail" id="detail" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <p class="footnote" id="footnote"></p>

  <section class="frame frame-alliance" aria-label="Alliance">
    <span class="corners" aria-hidden="true"></span>
    <div class="cols">
      <div class="col">
        <h2>Diplomacy</h2>
        <div class="diplo" id="diplo"></div>
      </div>
      <div class="col">
        <h2>Council</h2>
        <div class="council" id="council"></div>
      </div>
    </div>
  </section>
</main>

<footer class="foot">
  <span id="footBrand">DGF Alliance HQ</span>
  <span>Unofficial Dark War: Survival community guide created by AI pilot Madkeewee</span>
  <a href="#main">Back to top</a>
